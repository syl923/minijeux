<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Échecs — Moka Arcade</title>
  <meta name="description" content="Joue aux échecs contre l'ordinateur en 3 niveaux et gagne des pièces d'or.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>♞</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="echecs">
<main>
  <div class="titre-page">
    <h1>♞ Échecs</h1>
    <span class="doux" id="sous-titre">Tu as les blancs. Un pion qui atteint le bout de l'échiquier devient une dame.</span>
  </div>

  <section id="ecran-mode">
    <p style="text-align:center"><a class="bouton secondaire" href="/duels.html">⚔️ Jouer contre un autre joueur en ligne</a></p>
    <div class="choix-mode">
      <button data-niveau="facile"><span class="icone">🐣</span><strong>Facile</strong>L'ordinateur fait des gaffes<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
      <button data-niveau="normal"><span class="icone">🙂</span><strong>Normal</strong>Il voit 2 coups à l'avance<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
      <button data-niveau="difficile"><span class="icone">🧠</span><strong>Difficile</strong>Il calcule 3 coups<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
    </div>
  </section>

  <section id="ecran-jeu" class="cache">
    <div class="bandeau-duel cache" id="bandeau-duel">
      <span>⚔️ Duel en ligne contre</span><span class="vs" id="vs-adversaire">…</span>
      <span class="doux" id="vs-couleur"></span><span class="chrono-duel" id="chrono-duel"></span>
    </div>
    <div class="scene">
      <div>
        <div class="prises" id="prises-ia"></div>
        <div class="echiquier" id="echiquier"></div>
        <div class="prises" id="prises-joueur"></div>
      </div>
      <div class="panneau-lateral">
        <div class="grand-compteur"><span>Statut</span><b id="statut" style="font-size:20px">À toi !</b></div>
        <div class="grand-compteur"><span>Coups joués</span><b id="nb-coups">0</b></div>
        <div class="grand-compteur" id="bloc-niveau"><span>Niveau</span><b id="niveau" style="font-size:22px"></b></div>
        <button class="bouton secondaire" id="btn-abandon">🏳️ Abandonner</button>
      </div>
    </div>
  </section>
</main>
<script src="/assets/sons.js"></script>
<script src="/assets/icones.js"></script>
<script src="/assets/commun.js"></script>
<script src="/assets/echecs.js"></script>
</body>
</html>
