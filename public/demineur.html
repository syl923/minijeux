<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Démineur — Moka Arcade</title>
  <meta name="description" content="Le démineur avec des bombes farceuses : découvre toutes les cases sûres et gagne des pièces d'or.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💣</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="demineur">
<main>
  <div class="titre-page">
    <h1>💣 Démineur</h1>
    <span class="doux">Les chiffres indiquent combien de bombes touchent la case. Clic droit (ou appui long) pour poser un drapeau.</span>
  </div>

  <section id="ecran-mode">
    <div class="choix-mode">
      <button data-mode="facile"><span class="icone">🐣</span><strong>Facile</strong>9 × 9 · 10 bombes<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
      <button data-mode="moyen"><span class="icone">🔥</span><strong>Moyen</strong>16 × 16 · 40 bombes<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
    </div>
    <div class="galerie-bombes" id="galerie"></div>
  </section>

  <section id="ecran-jeu" class="cache">
    <div class="barre-jeu">
      <span class="compteur">💣 Restantes : <b id="restantes">0</b></span>
      <span class="compteur">⏱️ <b id="temps">0</b> s</span>
      <button class="bouton secondaire petit" id="btn-drapeau">🚩 Mode drapeau : non</button>
      <button class="bouton secondaire petit" id="btn-changer" style="margin-left:auto">↺ Changer de mode</button>
    </div>
    <div class="zone-demineur"><div class="plateau-demineur" id="plateau"></div></div>
  </section>
</main>
<script src="/assets/sons.js"></script>
<script src="/assets/icones.js"></script>
<script src="/assets/commun.js"></script>
<script src="/assets/demineur.js"></script>
</body>
</html>
