<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory — Moka Arcade</title>
  <meta name="description" content="Retrouve toutes les paires le plus vite possible et gagne des pièces d'or.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="memory">
<main>
  <div class="titre-page">
    <h1>🃏 Memory</h1>
    <span class="doux">20 s au départ (30 s en difficile), +5 s par paire trouvée. Trouve tout avant la fin du chrono !</span>
  </div>

  <section id="ecran-mode">
    <div class="choix-mode">
      <button data-mode="facile"><span class="icone">🐣</span><strong>Facile</strong>16 cartes<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
      <button data-mode="difficile"><span class="icone">🔥</span><strong>Difficile</strong>36 cartes · gains plus gros<br><span class="prix">Partie : 10 <i class="piece"></i></span></button>
    </div>
  </section>

  <section id="ecran-jeu" class="cache">
    <div class="barre-jeu">
      <span class="compteur">🎯 Essais : <b id="coups">0</b></span>
      <span class="compteur">✨ Paires : <b id="paires">0</b></span>
      <button class="bouton secondaire petit" id="btn-abandon" style="margin-left:auto">↺ Changer de mode</button>
    </div>
    <div class="chrono" id="chrono">
      <div class="chrono-barre"><div id="chrono-rempli"></div></div>
      <span class="chrono-texte">⏱️ <b id="temps">20,0</b> s</span>
    </div>
    <div class="plateau-memory" id="plateau"></div>
  </section>
</main>
<script src="/assets/sons.js"></script>
<script src="/assets/icones.js"></script>
<script src="/assets/commun.js"></script>
<script src="/assets/memory.js"></script>
</body>
</html>
