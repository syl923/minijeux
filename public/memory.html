<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory — MiniJeux</title>
  <meta name="description" content="Retrouve toutes les paires le plus vite possible et gagne des pièces d'or.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🃏</text></svg>">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="memory">
<main>
  <div class="titre-page">
    <h1>🃏 Memory</h1>
    <span class="doux">Retrouve les paires : moins d'essais et moins de temps = plus de points.</span>
  </div>

  <section id="ecran-mode">
    <div class="choix-mode">
      <button data-mode="facile"><span class="icone">🐣</span><strong>Facile</strong>16 cartes · jusqu'à 13 <i class="piece"></i></button>
      <button data-mode="difficile"><span class="icone">🔥</span><strong>Difficile</strong>36 cartes · jusqu'à 30 <i class="piece"></i></button>
    </div>
  </section>

  <section id="ecran-jeu" class="cache">
    <div class="barre-jeu">
      <span class="compteur">⏱️ <b id="temps">0:00</b></span>
      <span class="compteur">🎯 Essais : <b id="coups">0</b></span>
      <span class="compteur">✨ Paires : <b id="paires">0</b></span>
      <button class="bouton secondaire petit" id="btn-abandon" style="margin-left:auto">↺ Changer de mode</button>
    </div>
    <div class="plateau-memory" id="plateau"></div>
  </section>
</main>
<script src="/assets/commun.js"></script>
<script src="/assets/memory.js"></script>
</body>
</html>
